name: CI

on:
  push:
    branches: [main, 'maintenance/**', 'dev/**']
  pull_request:

jobs:
  lockfiles:
    name: Lockfiles resolve to the public registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject non-public registry URLs
        run: >-
          node --input-type=module -e
          "import { checkLockfile } from './tools/compatibility/fixtures.mjs';
          checkLockfile('package-lock.json'); checkLockfile('ui/package-lock.json');"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Record runtime and filesystem context
        run: >-
          node --input-type=module -e
          "import { availableParallelism, tmpdir } from 'node:os';
          import { realpathSync } from 'node:fs';
          import { resolve } from 'node:path';
          console.log(JSON.stringify({ node: process.version, uv: process.versions.uv,
          platform: process.platform, arch: process.arch, parallelism: availableParallelism(),
          tempPathAliased: resolve(tmpdir()) !== realpathSync.native(tmpdir()) }));"
      - run: npm ci
      - name: Syntax check
        run: |
          node --check bin/mcp-bridge.mjs
          node --check bin/cli.mjs
          node --check bin/top.mjs
          node --check bin/config-checks.mjs
          node --check bin/server-metrics.mjs
          node --check bin/pooling-config.mjs
          node --check bin/pooling-execution.mjs
          node --check bin/pooling-batch-scheduler.mjs
          node --check bin/pooling-batches.mjs
          node --check bin/pooling-editor.mjs
          node --check bin/pooling-errors.mjs
          node --check bin/pooling-files.mjs
          node --check bin/pooling-writer.mjs
          node --check bin/prewarm.mjs
          node --check bin/logs.mjs
          node --check bin/shared-sessions.mjs
          node --check bin/windows-process-lifetime.mjs
          node --check bin/windows-legacy-process.mjs
          node --check bin/legacy-upgrade.mjs
          node --check bin/legacy-installation.mjs
          node --check bin/account-upgrade-controller.mjs
          node --check bin/account-upgrade-worker.mjs
          node --check bin/windows-task-channel.mjs
      - name: Restore pinned Windows native toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolchain = ./tools/windows-ci/restore-toolchain.ps1 -DestinationDirectory "$env:RUNNER_TEMP/native-toolchain"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MCP_NATIVE_COMPILER=$($toolchain.CompilerPath)"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MCP_NATIVE_REFERENCES=$($toolchain.ReferenceAssemblyPath)"
          ./tools/windows-ci/test-toolchain.ps1 -PackageDirectory $toolchain.PackageDirectory -TestDirectory "$env:RUNNER_TEMP/native-toolchain-tests"
      - name: Verify process lifetime helper reproducible build
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/windows-process-lifetime/build.ps1 -Verify -CompilerPath $env:MCP_NATIVE_COMPILER -ReferenceAssemblyPath $env:MCP_NATIVE_REFERENCES
      - name: Verify separate legacy broker reproducible build
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/windows-legacy/build.ps1 -Verify -CompilerPath $env:MCP_NATIVE_COMPILER -ReferenceAssemblyPath $env:MCP_NATIVE_REFERENCES
      - name: Verify query-only task channel reproducible build
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/windows-task-channel/build.ps1 -Verify -CompilerPath $env:MCP_NATIVE_COMPILER -ReferenceAssemblyPath $env:MCP_NATIVE_REFERENCES
      - name: Record Windows native caller context
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $policy = Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name EnableLUA,ConsentPromptBehaviorAdmin
          [ordered]@{ EnableLUA = $policy.EnableLUA; ConsentPromptBehaviorAdmin = $policy.ConsentPromptBehaviorAdmin } | ConvertTo-Json -Compress
          node --input-type=module -e '
            import { queryCliCallerContext } from "./bin/windows-task-channel.mjs";
            const caller = await queryCliCallerContext();
            const { elevated, enabledAdministrator, restricted, appContainer,
              guardThreadImpersonating, parentThreadImpersonation } = caller.actorFacts ?? {};
            const { completeStableThreadSet, primaryStable, threadCount } = caller.observation ?? {};
            console.log(JSON.stringify({
              proofScope: caller.proofScope, ordinaryEligible: caller.ordinaryEligible, reason: caller.reason,
              elevated, enabledAdministrator, restricted, appContainer,
              guardThreadImpersonating, parentThreadImpersonation,
              completeStableThreadSet, primaryStable, threadCount,
              helperExitCode: caller.helperExit.code, helperExitSignal: caller.helperExit.signal
            }));'
      - name: Verify ordinary Windows CI launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: node tools/windows-ci/ordinary-tests.mjs --output "$env:RUNNER_TEMP/ordinary-launcher-tests"
      - name: Test
        if: runner.os != 'Windows'
        run: npm test
      - name: Test in ordinary Windows context
        if: runner.os == 'Windows'
        run: node tools/windows-ci/ordinary-run.mjs test
      - name: Pooling failure evidence regressions
        if: always() && runner.os == 'Windows'
        env:
          MCP_POOLING_TRACE_RUN_FAULTS: '1'
        run: node tools/windows-ci/ordinary-run.mjs pooling-diagnostics
      - name: Prepare the exact release and patch compatibility pair
        if: runner.os != 'Windows'
        run: npm run compat:prepare
      - name: Prepare compatibility in ordinary Windows context
        if: runner.os == 'Windows'
        run: node tools/windows-ci/ordinary-run.mjs compat:prepare
      - name: Real-version CLI and API compatibility
        if: runner.os != 'Windows'
        run: npm run test:compat
      - name: Real-version compatibility in ordinary Windows context
        if: runner.os == 'Windows'
        run: node tools/windows-ci/ordinary-run.mjs test:compat
      - name: Clean owned compatibility fixtures
        if: always() && runner.os != 'Windows'
        run: npm run compat:clean
      - name: Clean compatibility in ordinary Windows context
        if: always() && runner.os == 'Windows'
        run: node tools/windows-ci/ordinary-run.mjs compat:clean

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install CLI dependencies
        run: npm ci
      - name: Test and build web dashboard
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Verify rebuilt dashboard matches committed bytes
        run: git diff --exit-code HEAD -- ui/dist THIRD_PARTY_NOTICES.txt
      - name: Install bundled Chromium for compatibility
        working-directory: ui
        run: npx --no-install playwright install --with-deps chromium
      - name: Prepare the exact release and patch pair with built dashboard
        run: npm run compat:prepare
      - name: Real-version browser compatibility
        run: npm run test:compat:browser
      - name: Clean owned compatibility fixtures
        if: always()
        run: npm run compat:clean
