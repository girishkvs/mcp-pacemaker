name: CI

on:
  push:
    branches: [main, dev/girishkvs/pooling-batch-reload]
  pull_request:

jobs:
  lockfiles:
    name: Lockfiles resolve to the public registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject non-public registry URLs
        run: >-
          node --input-type=module -e
          "import { checkLockfile } from './tools/compatibility/fixtures.mjs';
          checkLockfile('package-lock.json'); checkLockfile('ui/package-lock.json');"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: |
          node --check bin/mcp-bridge.mjs
          node --check bin/cli.mjs
          node --check bin/top.mjs
          node --check bin/config-checks.mjs
          node --check bin/server-metrics.mjs
          node --check bin/pooling-config.mjs
          node --check bin/pooling-execution.mjs
          node --check bin/pooling-batch-scheduler.mjs
          node --check bin/pooling-batches.mjs
          node --check bin/pooling-editor.mjs
          node --check bin/pooling-errors.mjs
          node --check bin/pooling-files.mjs
          node --check bin/pooling-writer.mjs
          node --check bin/prewarm.mjs
          node --check bin/logs.mjs
          node --check bin/shared-sessions.mjs
      - name: Test
        run: npm test
      - name: Prepare pinned 1.3.0 and packed 2.0.0
        run: npm run compat:prepare
      - name: Real-version CLI and API compatibility
        run: npm run test:compat
      - name: Clean owned compatibility fixtures
        if: always()
        run: npm run compat:clean

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Test and build web dashboard
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Install CLI dependencies
        run: npm ci
      - name: Install bundled Chromium for compatibility
        working-directory: ui
        run: npx --no-install playwright install --with-deps chromium
      - name: Prepare pinned 1.3.0 and packed 2.0.0 with built dashboard
        run: npm run compat:prepare
      - name: Real-version browser compatibility
        run: npm run test:compat:browser
      - name: Clean owned compatibility fixtures
        if: always()
        run: npm run compat:clean
