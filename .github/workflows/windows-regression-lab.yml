name: Windows regression lab

on:
  push:
    branches: [windows-regression-lab-20261006]
    paths:
      - .github/workflows/windows-regression-lab.yml
      - .ci/windows-regression-lab/**

permissions:
  contents: read

concurrency:
  group: windows-regression-lab-20261006
  cancel-in-progress: false

jobs:
  private-test:
    if: github.actor == 'girishkvs' && github.repository == 'girishkvs/mcp-pacemaker' && github.run_attempt == '1'
    runs-on: windows-2022
    timeout-minutes: 30
    environment: windows-regression-lab-20261006
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install locked transport dependencies
        working-directory: .ci/windows-regression-lab
        run: npm ci --registry=https://registry.npmjs.org/ --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Run one private regression-test session
        working-directory: .ci/windows-regression-lab
        env:
          WINDOWS_LAB_BOOTSTRAP: ${{ secrets.WINDOWS_LAB_BOOTSTRAP }}
          DEBUG: ''
          NODE_DEBUG: ''
          NODE_DEBUG_NATIVE: ''
          NODE_OPTIONS: ''
          SSLKEYLOGFILE: ''
        run: node host.cjs
