name: Stage npm release

# Short publication path, used for 2.1.0, 2.1.1, 2.1.2 and 1.3.2. It packs the tagged source, checks the packed
# CLI, and stages it once with npm trusted publishing and provenance. The dist-tag comes from the major version:
# 1.x stages on legacy, 2.x on latest, anything else is refused. The owner still approves the protected
# npm-publish environment here and the staged version on npmjs.com. Hosted CI covers the tests.
on:
  workflow_dispatch:
    inputs:
      action:
        description: This workflow version only stages
        type: choice
        options: [stage]
        default: stage
        required: true
      approval:
        description: Not used by this workflow version
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: npm-publication-mcp-pacemaker
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require a hosted runner and a release tag
        env:
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$ACTUAL_RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          case "$GITHUB_REF" in
            refs/tags/v*|refs/tags/npm-r*/v*) ;;
            *) echo "::error::Dispatch against the release tag, not $GITHUB_REF"; exit 1 ;;
          esac
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Check the tag matches the package and the version is unpublished
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$(node -p "require('./package.json').name")" = mcp-pacemaker
          test "${GITHUB_REF##*/v}" = "$version"
          if npm view "mcp-pacemaker@$version" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "::error::mcp-pacemaker@$version is already published"; exit 1
          fi
          case "$version" in
            1.*) channel=legacy ;;
            2.*) channel=latest ;;
            *) echo "::error::No npm channel for $version"; exit 1 ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "CHANNEL=$channel" >> "$GITHUB_ENV"
      - name: Pack the tagged source
        run: |
          mkdir "$RUNNER_TEMP/pack"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"
          sha256sum "$RUNNER_TEMP/pack/mcp-pacemaker-$VERSION.tgz"
      - name: Install the packed tarball and run its CLI
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/pack/mcp-pacemaker-$VERSION.tgz"
          test "$(node node_modules/mcp-pacemaker/bin/cli.mjs --version)" = "$VERSION"
      - name: Install npm 12.0.2 with empty npm config
        run: |
          home="$RUNNER_TEMP/npm-toolchain-home"
          mkdir "$home"
          : > "$home/user.npmrc"
          : > "$home/global.npmrc"
          npm install --prefix "$RUNNER_TEMP/npm-toolchain" npm@12.0.2 --ignore-scripts --no-audit --no-fund \
            --no-package-lock --registry=https://registry.npmjs.org/ \
            --userconfig="$home/user.npmrc" --globalconfig="$home/global.npmrc"
          echo "NPM_CLI=$RUNNER_TEMP/npm-toolchain/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
          echo "NPM_HOME=$home" >> "$GITHUB_ENV"
      - name: Stage once with npm trusted publishing and provenance
        run: |
          test "$(node "$NPM_CLI" --version)" = 12.0.2
          node "$NPM_CLI" stage publish "$RUNNER_TEMP/pack/mcp-pacemaker-$VERSION.tgz" --access=public \
            --tag="$CHANNEL" --registry=https://registry.npmjs.org/ --provenance --ignore-scripts --json \
            --userconfig="$NPM_HOME/user.npmrc" --globalconfig="$NPM_HOME/global.npmrc" \
            | tee "$RUNNER_TEMP/pack/stage.json"
      - name: Keep the staged tarball and stage receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: npm-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pack/
          if-no-files-found: warn
          retention-days: 30
